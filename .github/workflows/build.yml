name: Build (Windows, macOS Intel, macOS Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-13
            name: macos-intel
          - os: macos-14
            name: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf fastembed pyinstaller

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --name devon
          devon_main.py --collect-all fastembed

      - name: Smoke test
        run: |
          dist/devon${{ matrix.os == 'windows-latest' && '.exe' || '' }} --help

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          Compress-Archive -Path dist/devon.exe
          -DestinationPath DocClassifier-windows-x64.zip

      - name: Package (macOS)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x dist/devon
          tar -czf DocClassifier-${{ matrix.name }}.tar.gz -C dist devon

      - uses: actions/upload-artifact@v4
        with:
          name: DocClassifier-${{ matrix.name }}
          path: DocClassifier-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
